# Define AI model used
model_list:
  - model_name: ollama/llama3.1
    litellm_params:
      model: ollama/llama3.1
      api_base: http://ollama:11434

litellm_settings:
  callbacks: 
  # Run model through custom guardrails
  - custom_guardrail.enterprise_guardrail
  # allows metric collection for model through prometheus
  - prometheus 

  # only for dev and test: configure masterkey once complete
  general_settings:
    dangerously_permit_weak_or_unset_master_key: true
