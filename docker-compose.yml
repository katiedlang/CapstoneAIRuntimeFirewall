FROM ghcr.io/berriai/litellm:main-latest

WORKDIR /app

# Install custom security scanning dependencies
RUN pip install --no-cache-dir llm-guard torch transformers

# Copy configuration and guardrail script into the image
COPY litellm_config.yaml /app/config.yaml
COPY custom_guardrail.py /app/custom_guardrail.py

EXPOSE 4000

CMD ["--config", "/app/config.yaml", "--port", "4000"]
